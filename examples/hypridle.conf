# Merge these into your existing general block only after testing the real locker.
# Keep your existing idle timers. Do not start a second hypridle instance.
general {
    lock_cmd = island lock --wait
    before_sleep_cmd = island lock --wait
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Release the sleep inhibitor only on compositor session-lock notification.
    inhibit_sleep = 3
}
